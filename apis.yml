apis:
- name: Tecton HTTP API
  description: >-
    REST API for the Tecton feature platform - the Feature Service (low-latency online
    feature retrieval, e.g. POST /api/v1/feature-service/get-features), the Ingest API,
    the Metadata API, and SCIM 2.0 provisioning. Authenticated with an Authorization
    Tecton-key header or a Service-Account OAuth access token. The runtime host is
    per-deployment (https://<deployment>.tecton.ai); see the HTTP API reference.
  humanURL: https://docs.tecton.ai/http-api
  baseURL: https://docs.tecton.ai
