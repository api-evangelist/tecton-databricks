name: Tecton (Databricks)
description: >-
  Tecton is a feature platform (feature store) for machine learning and AI. It lets data and
  ML teams define feature transformations once and run them across batch, streaming, and
  real-time data sources, then materialize and serve those features from a low-latency online
  store. Features are authored in Python and managed GitOps-style via the tecton CLI and SDK,
  and consumed at inference time over the Feature Service HTTP API (Authorization: Tecton-key,
  or Service-Account OAuth). Tecton also ships an Ingest API, a Metadata API, an official MCP
  server, and Java/Python clients. The company was acquired by Databricks in August 2025 and
  its platform now powers real-time features and context serving for AI agents.
